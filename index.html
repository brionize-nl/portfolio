<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brionize - Dominique Gerritsen</title>
    <meta name="description" content="Gebruikte laptops een tweede leven geven, eigen tools bouwen, en technologie toegankelijk maken.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg-color: #121212;
            --bg-card: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #999;
            --accent-color: #8886ff;
            --accent-dim: rgba(136, 134, 255, 0.1);
            --border-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        header {
            background-color: var(--bg-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        nav h1 { color: var(--accent-color); font-size: 1.5rem; margin: 0; }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--accent-color); }

        section {
            padding: 4rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        section h2 {
            color: var(--accent-color);
            margin-bottom: 0.3rem;
            font-size: 1.5rem;
        }

        .section-sub {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hero {
            text-align: center;
            padding: 5rem 2rem 3rem;
        }

        .hero-name {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0 0 0.2rem;
            color: var(--text-color);
        }

        .hero-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin: 0 0 1.5rem;
            font-weight: 400;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 2rem;
        }
